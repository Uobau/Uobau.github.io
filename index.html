<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CONWIP HMLV — Web (GitHub Pages)</title>
  <style>
    :root{
      --bg:#121216; --ink:#EBEBF0; --mid:#5C606E; --grey:#7D808C;
      --green:#50C878; --amber:#F0C850; --red:#DC5A5A; --purple:#B478F0; --cyan:#50D2D2;
      --panel:#1A1A22; --panel-2:#23232D; --panel-3:#282A35;
      --accent:#FF40A0; /* Start color */
    }
    html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,Segoe UI,Roboto,Helvetica,Arial,sans-serif}
    #wrap{position:fixed;inset:0;display:grid;grid-template-rows:42px 1fr 160px;grid-template-columns:1fr 420px;grid-template-areas:
      "toolbar toolbar"
      "stage side"
      "footer side";}
    #toolbar{grid-area:toolbar;display:flex;gap:.5rem;align-items:center;padding:.4rem .6rem;background:#14141A;border-bottom:1px solid #2e2e38}
    #stage{grid-area:stage;position:relative;overflow:hidden;background:var(--bg)}
    #footer{grid-area:footer;background:#14141A;border-top:1px solid #2e2e38;padding:.4rem .6rem;overflow:auto}
    #side{grid-area:side;background:var(--panel);border-left:1px solid #2e2e38;display:flex;flex-direction:column}
    #canvas{position:absolute;inset:0}

    .btn{background:#1f1f28;border:1px solid #33384a;color:var(--ink);padding:.35rem .6rem;border-radius:.5rem;cursor:pointer}
    .btn[aria-pressed="true"]{background:#313244}
    .btn:disabled{opacity:.5;cursor:not-allowed}
    .sep{width:1px;height:24px;background:#343644;margin:0 .5rem}
    .field{display:inline-flex;align-items:center;gap:.5rem}
    input[type="range"]{accent-color:#7aa2f7}

    .card{background:var(--panel-2);border:1px solid #343644;border-radius:.75rem;padding:.75rem;margin:.5rem}
    .title{font-weight:700;margin-bottom:.3rem}
    .muted{color:#c8cad3}
    .mono{font-family:ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace}

    .badge{display:inline-block;border:1px solid #44495e;border-radius:.5rem;padding:.1rem .4rem;margin-right:.3rem;background:#27293a}
    .pill{display:inline-flex;align-items:center;gap:.35rem;border:1px solid #43465a;background:#21242f;border-radius:999px;padding:.2rem .5rem}
    .bar{height:10px;border:1px solid #3c3f52;border-radius:6px;position:relative;background:#1f2230}
    .bar>i{display:block;height:100%;background:var(--green);border-radius:5px}

    a.button-link{color:#9cc9ff;text-decoration:none}
    .kbd{border:1px solid #3c3f52;background:#1f2130;border-radius:.4rem;padding:.05rem .35rem}
    .hint{opacity:.9;font-size:13px}

    /* Side panel */
    #jobPanel{flex:1 1 auto;overflow:auto}
    #jobPanel .route{white-space:normal;word-break:break-word}
  </style>
</head>
<body>
  <div id="wrap">
    <div id="toolbar">
      <button id="btnPlay" class="btn" title="Spacja">▶︎ Start</button>
      <button id="btnStep" class="btn" title="→">Krok</button>
      <span class="sep"></span>
      <span class="field">Szybkość <input id="speed" type="range" min="0.05" max="10" step="0.05" value="0.5"><span id="speedVal" class="mono">x0.50</span></span>
      <span class="field">Transport <input id="moveTime" type="range" min="0.2" max="10" step="0.1" value="1.5"><span id="moveVal" class="mono">1.5m</span></span>
      <span class="sep"></span>
      <span class="field">CONWIP <input id="conwip" type="range" min="1" max="20" step="1" value="6"><span id="conwipVal" class="mono">6 kart</span></span>
      <button id="btnApplyConwip" class="btn">Zastosuj</button>
      <span class="sep"></span>
      <button id="btnQueues" class="btn" aria-pressed="true">Ukryj kolejki</button>
      <button id="btnFit" class="btn">Dopasuj</button>
      <button id="btnSaveLayout" class="btn">Zapisz layout</button>
      <button id="btnLoadLayout" class="btn">Wczytaj layout</button>
      <span class="sep"></span>
      <button id="btnCsv" class="btn">Pobierz CSV</button>
      <button id="btnJsonl" class="btn">Pobierz JSONL</button>
      <div style="margin-left:auto" class="muted hint">
        <span class="kbd">LPM</span> przeciągnij węzeł/slot · <span class="kbd">K</span> REL/ABS slotu · <span class="kbd">PPM</span> Pan · kółko Zoom · <span class="kbd">Esc</span> odznacz
      </div>
    </div>

    <div id="stage">
      <canvas id="canvas" width="1560" height="980"></canvas>
    </div>

    <div id="footer">
      <div id="footerContent"></div>
    </div>

    <div id="side">
      <div class="card" style="margin: .75rem .75rem .25rem">
        <div class="title">Stan</div>
        <div id="stateLine" class="mono"></div>
      </div>
      <div id="jobPanel" class="card" style="margin: .25rem .75rem .75rem">
        <div class="title">Szczegóły zadania</div>
        <div class="muted">Kliknij token lub kropkę w kolejce.</div>
        <div id="jobDetails"></div>
      </div>
    </div>
  </div>

<script>
// ===========================
// CONWIP HMLV — Web (Canvas)
// ===========================
// 5-station system: Start, Toczenie, Frezowanie, Kontrola, Sink
// Global CONWIP cards: release only if a card is available; when job reaches Sink, card returns to Start.
// Supports repeated operations (e.g. "Toczenie → Frezowanie → Toczenie").

// ---------- Stałe UI/świata ----------
const WORLD_W=1560, WORLD_H=980;
const NODE_R=46;
const PROGRESS_MARGIN_Y=14;
const FOOTER_H=160; // dolny panel (poza canvasem)

// Kolory
const COLOR={
  bg:'#121216', ink:'#EBEBF0', mid:'#5C606E', grey:'#7D808C',
  green:'#50C878', amber:'#F0C850', red:'#DC5A5A', purple:'#B478F0', cyan:'#50D2D2',
  start:'#FF40A0'
};
const PALETTE=['#56B4E9','#E69F00','#009E73','#F0E442','#0072B2','#D55E00','#CC79A7'];

const QUEUE_DOT_R=7, QUEUE_GAP=8, QUEUE_BAR_H_BASE=28;
const QUEUE_COLS_EXP=6, QUEUE_COLLAPSED_SHOW=5;
const SLOT_PADDING_X=12, SLOT_PADDING_Y=6, ROW_H=QUEUE_DOT_R*2+6;

let FPS=60; // w requestAnimationFrame
let SIM_SPEED=0.5; // mnożnik czasu
let MOVE_TIME=1.5; // min
const SIM_DT_STEP=2.0; // manual step (min)
const N_JOBS=36; const SEED=15; const ARRIVAL_MEAN=10.0; // min, backlog arrivals
let CONWIP_LIMIT=6; // slider

// Komórki
const CELLS=["Start","Toczenie","Frezowanie","Kontrola","Sink"];
let NODE_POS={
  Start:[120,480],
  Toczenie:[520,320],
  Frezowanie:[860,320],
  Kontrola:[690,640],
  Sink:[1320,480]
};

// Marszruty (w tym powrót do Toczenia)
const ROUTES_CORE=[
  ["Toczenie","Frezowanie","Toczenie","Kontrola"],
  ["Toczenie","Frezowanie","Kontrola"],
  ["Frezowanie","Kontrola"],
  ["Toczenie","Kontrola"],
  ["Frezowanie","Toczenie","Kontrola"]
];

// Kolory krawędzi (pary występujące w marszrutach)
const EDGE_OPS=(()=>{ const s=new Set(); for(const r of ROUTES_CORE){for(let i=0;i<r.length-1;i++) s.add(r[i]+"→"+r[i+1]);} return Array.from(s).sort(); })();
const PAIR_COLORS=(()=>{ const map=new Map(); let it=0; for(const p of EDGE_OPS){ map.set(p, PALETTE[it++%PALETTE.length]); } map.set('Start→Toczenie', COLOR.start); map.set('Start→Frezowanie', COLOR.start); map.set('Start→Kontrola', COLOR.start); return map; })();
function colorForPair(a,b){ return PAIR_COLORS.get(`${a}→${b}`) || '#B4B4BE'; }

// RNG
function mulberry32(a){return function(){let t=a+=0x6D2B79F5;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296;}}
let rnd = mulberry32(SEED);
function rand(){return rnd();}
function randExp(mean){return -Math.log(1-rand())*mean;}
function randNormal(){const u=1-rand(), v=1-rand(); return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);} 
function randLogNormal(mu, sigma){return Math.exp(mu + sigma*randNormal());}

function procTime(cell){
  let mu, s; // lognormal
  switch(cell){
    case 'Toczenie': mu=Math.log(40); s=.6; break;
    case 'Frezowanie': mu=Math.log(35); s=.7; break;
    case 'Kontrola': mu=Math.log(20); s=.5; break;
    default: mu=Math.log(30); s=.6;
  }
  return randLogNormal(mu, s);
}

// ---------- Symulacja CONWIP ----------
class Event{constructor(time,type,payload){this.time=time;this.type=type;this.payload=payload;}}
class MinHeap{constructor(){this.a=[]} push(e){this.a.push(e);this._up(this.a.length-1)} _up(i){while(i>0){const p=(i-1>>1); if(this.a[p].time<=this.a[i].time) break; [this.a[p],this.a[i]]=[this.a[i],this.a[p]]; i=p}} pop(){if(this.a.length===0) return null; const r=this.a[0]; const x=this.a.pop(); if(this.a.length){this.a[0]=x; this._dn(0);} return r} _dn(i){for(;;){let l=i*2+1, r=i*2+2, m=i; if(l<this.a.length && this.a[l].time<this.a[m].time) m=l; if(r<this.a.length && this.a[r].time<this.a[m].time) m=r; if(m===i) break; [this.a[m],this.a[i]]=[this.a[i],this.a[m]]; i=m}} peek(){return this.a.length?this.a[0]:null} get length(){return this.a.length}}
class Job{constructor(jid,route,times){this.jid=jid;this.route=route;this.times=times}}

class ConwipSim{
  constructor(n=N_JOBS){
    this.time=0; this.WIP=0; this.log=[]; this.jobs={};
    this.cell_busy_until={}; this.cell_current={}; this.cell_queues={};
    this.events=new MinHeap();
    this.backlog=[]; // jid waiting for CONWIP card
    this.cards_total=CONWIP_LIMIT; this.cards_avail=CONWIP_LIMIT;

    // zlecenia
    for(let i=1;i<=n;i++){
      const r=ROUTES_CORE[Math.floor(rand()*ROUTES_CORE.length)];
      const times=r.map(c=>procTime(c));
      const jid=`Z${String(i).padStart(2,'0')}`; this.jobs[jid]=new Job(jid, r.slice(), times);
    }
    const ops=CELLS.filter(c=>c!=="Start"&&c!=="Sink");
    for(const c of ops){this.cell_busy_until[c]=0; this.cell_current[c]=null; this.cell_queues[c]=[]}

    // arrivals do backlogu
    let t=0; for(const jid of Object.keys(this.jobs)) { t+=randExp(ARRIVAL_MEAN); this.events.push(new Event(t,'arrival',[jid])); }
  }

  _emit(rec){ this.log.push(rec); }
  _log(ev,{jid=null,cell=null,idx=null,details=null}={}){
    const route = jid? this.jobs[jid].route.join(' → '): null;
    const op = (jid!=null && idx!=null && idx < this.jobs[jid].route.length)? this.jobs[jid].route[idx] : null;
    this._emit({czas:+this.time.toFixed(2), zdarzenie:ev, zlecenie:jid, operacja:op, gniazdo:cell,
      szczegóły:details, WIP:this.WIP, conwip:`${this.cards_avail}/${this.cards_total}`, marszruta:route});
  }

  tryReleaseFromBacklog(){
    while(this.cards_avail>0 && this.backlog.length){
      const jid=this.backlog.shift(); this.cards_avail--; this._log('CONWIP: WYDANIE KARTY',{jid,cell:'Start'});
      const first=this.jobs[jid].route[0]; const end=this.time+MOVE_TIME;
      this.events.push(new Event(end,'finish_move',[jid,0,first,this.jobs[jid].route,this.jobs[jid].times,'Start']));
      this._log('RELEASE',{jid,cell:'Start',details:`start → ${first}`});
    }
  }

  tryStart(cell,jid,idx,route,times){
    if(this.cell_current[cell] || this.cell_busy_until[cell]>this.time){ this.cell_queues[cell].push([jid,idx,route,times,cell]); return false; }
    const start=this.time, finish=start+times[idx];
    this.cell_busy_until[cell]=finish; this.cell_current[cell]=[jid,idx,route,times,start,finish];
    this.events.push(new Event(finish,'finish_op',[cell])); this.WIP++; this._log('START',{jid,cell,idx,details:`czas=${times[idx].toFixed(1)} min`});
    return true;
  }

  canHeadStart(cell){
    if(this.cell_current[cell]) return false; if(this.cell_busy_until[cell]>this.time) return false;
    const q=this.cell_queues[cell]; if(!q.length) return false; return true;
  }

  sweepStarts(){
    let progressed=true; while(progressed){
      progressed=false;
      for(const cell of Object.keys(this.cell_current)){
        if(!this.cell_current[cell] && this.cell_busy_until[cell]<=this.time && this.cell_queues[cell].length){
          const [jid,idx,route,times]=this.cell_queues[cell][0];
          this.cell_queues[cell].shift(); if(this.tryStart(cell,jid,idx,route,times)) progressed=true;
        }
      }
    }
  }

  stepUntil(tLimit){
    for(;;){
      const ev=this.events.peek(); if(!ev || ev.time>tLimit){ this.time=tLimit; break; }
      this.events.pop(); this.time=ev.time;
      if(ev.type==='arrival'){
        const [jid]=ev.payload; this.backlog.push(jid); this._log('ARRIVAL',{jid,cell:'Start',details:'backlog +1'}); this.tryReleaseFromBacklog();
      }
      else if(ev.type==='finish_op'){
        const [cell]=ev.payload; const cur=this.cell_current[cell]; if(!cur) continue;
        const [jid,idx,route,times,start,finish]=cur; this.cell_current[cell]=null; this.WIP--; this._log('FINISH',{jid,cell,idx,details:`koniec w ${cell}`});
        if(idx<route.length-1){
          const next_cell=route[idx+1]; const end=this.time+MOVE_TIME;
          this.events.push(new Event(end,'finish_move',[jid,idx+1,next_cell,route,times,cell]));
          this._log('RUSZA NA KRAWĘDŹ',{jid,cell:next_cell,idx:idx+1,details:`transport → ${next_cell}`});
        }else{
          const end=this.time+MOVE_TIME; this.events.push(new Event(end,'finish_move',[jid,null,'Sink',route,times,cell]));
          this._log('RUSZA NA KRAWĘDŹ',{jid,cell:'Sink',idx:idx+1,details:'transport → Sink'});
        }
        this.sweepStarts();
      }
      else if(ev.type==='finish_move'){
        const [jid,idx,next_cell,route,times,src]=ev.payload;
        if(next_cell==='Sink'){ this._log('PRZYBYŁ DO SINK',{jid,cell:'Sink',details:'zlecenie ukończone'}); this.cards_avail++; this._log('CONWIP: ZWROT KARTY',{jid,cell:'Sink'}); this.tryReleaseFromBacklog(); }
        else{ this.cell_queues[next_cell].push([jid,idx,route,times,src]); this._log('PRZYBYŁ DO GNIAZDA',{jid,cell:next_cell,idx,details:`w kolejce ${next_cell}`}); this.sweepStarts(); }
      }
    }
  }
}

// ---------- Wizualizacja / interakcja ----------
const canvas=document.getElementById('canvas');
const ctx=canvas.getContext('2d');
let viewScale=1, viewOff=[0,0];
function fitToWindow(){ const cw=document.getElementById('stage').clientWidth; const ch=document.getElementById('stage').clientHeight; const s=Math.min(cw/WORLD_W, ch/WORLD_H); viewScale=Math.max(0.4, Math.min(2.0, s)); const vw=Math.min(WORLD_W, cw/viewScale), vh=Math.min(WORLD_H, ch/viewScale); viewOff[0]=Math.max(0,(WORLD_W-vw)/2); viewOff[1]=Math.max(0,(WORLD_H-vh)/2); }
fitToWindow();

let SHOW_QUEUES=true; let queueExpanded=new Set(); let queueHits=new Map();
let selectedJob=null; let draggingNode=null, dragOff=[0,0]; let draggingSlot=null, dragSlotOff=[0,0];
let slotMode={}, slotAnchorRel={}, slotPosAbs={};
const tokens=new Map();

class Token{ constructor(jid,route){ this.jid=jid; this.route=route; this.state='pre_entry'; this.active=false; this.cell='Start'; this.idx=-1; this.moveStart=0; this.moveEnd=0; this.moveFrom=null; this.moveTo=null; this.lastPair=['Start', route[0]]; } setActive(a=true){this.active=a} setInCell(cell,idx){this.state='in_cell'; this.cell=cell; this.idx=idx} setMoving(a,b,st,en,idx){this.state='moving'; this.moveFrom=a; this.moveTo=b; this.moveStart=st; this.moveEnd=en; this.idx=idx; this.lastPair=[a,b]} position(t){ if(!this.active) return NODE_POS['Start']; if(this.state==='in_cell') return NODE_POS[this.cell]; if(this.state==='moving'){ const f=Math.max(0,Math.min(1,(t-this.moveStart)/(this.moveEnd-this.moveStart))); const [ax,ay]=NODE_POS[this.moveFrom], [bx,by]=NODE_POS[this.moveTo]; return [ax+(bx-ax)*f, ay+(by-ay)*f]; } return NODE_POS['Start']; }}

function renderFooter(sim){ const cont=document.getElementById('footerContent'); const wipList = Object.entries(sim.cell_current).filter(([c,cur])=>!!cur).map(([cell,cur])=>{ const [jid,idx,route,times,start,finish]=cur; const frac=Math.max(0, Math.min(1, (sim.time-start)/(finish-start))); return {jid,cell,frac}; }).slice(0,8); let html = `<div class="title" style="margin:.25rem 0">WIP: ${wipList.length}  |  CONWIP: ${sim.cards_avail}/${sim.cards_total}  |  Backlog: ${sim.backlog.length}</div>`; for(const {jid,cell,frac} of wipList){ html += `<div style="display:flex;align-items:center;gap:.5rem;margin:.2rem 0"><div class="mono" style="width:120px">${jid}@${cell}</div><div class="bar" style="width:220px"><i style="width:${(frac*100).toFixed(0)}%"></i></div><div class="mono" style="width:36px;text-align:right">${(frac*100).toFixed(0)}%</div></div>` } cont.innerHTML=html; }

function renderJobPanel(sim, jid){ const el=document.getElementById('jobDetails'); if(!jid){ el.innerHTML='<span class="muted">—</span>'; return; } const job=sim.jobs[jid]; const tok=tokens.get(jid); let status='pre-entry'; if(tok.state==='moving') status = `w transporcie: ${tok.moveFrom} → ${tok.moveTo}`; else if(tok.state==='in_cell'){ let prog=null; for(const [cell,cur] of Object.entries(sim.cell_current)){ if(cur){ const [cj,idx,route,times,start,finish]=cur; if(cj===jid){ prog=Math.max(0,Math.min(1,(sim.time-start)/(finish-start))); break; }} } status = (prog!=null)? `w obróbce: ${tok.cell} (${(prog*100).toFixed(0)}%)` : `w kolejce: ${tok.cell}`; } const stageIdx=Math.max(tok.idx,0), total=job.route.length, done=(tok.state==='moving'||tok.state==='in_cell')? stageIdx:0; const routeTxt=job.route.join(' → '); const pct = total? Math.max(0,Math.min(1, done/total)) : 0; el.innerHTML = `<div class="mono" style="margin:.25rem 0 .5rem">Zadanie <b>${jid}</b></div><div class="route">${routeTxt}</div><div style="margin:.4rem 0 .2rem" class="muted">Etap: ${Math.min(stageIdx+1,total)}/${total}  |  Status: ${status}</div><div class="bar" style="width:100%"><i style="width:${(pct*100).toFixed(0)}%"></i></div>`; }

function boundaryPoint(ax,ay,bx,by,r=NODE_R-4){ const ang=Math.atan2(by-ay,bx-ax); return [ax+Math.cos(ang)*r, ay+Math.sin(ang)*r]; }

function drawWorld(sim){ ctx.clearRect(0,0,canvas.width,canvas.height); ctx.save(); ctx.translate(-viewOff[0], -viewOff[1]); ctx.scale(viewScale, viewScale);
  // Krawędzie (proste)
  for(const p of EDGE_OPS){ const [a,b]=p.split('→'); const col=(a==='Start')? COLOR.start : colorForPair(a,b); ctx.strokeStyle=col; ctx.lineWidth=2; const [ax,ay]=NODE_POS[a], [bx,by]=NODE_POS[b]; const [x1,y1]=boundaryPoint(ax,ay,bx,by), [x2,y2]=boundaryPoint(bx,by,ax,ay); ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke(); const ang=Math.atan2(y2-y1,x2-x1); const p1=[x2-Math.cos(ang+0.6)*10, y2-Math.sin(ang+0.6)*10]; const p2=[x2-Math.cos(ang-0.6)*10, y2-Math.sin(ang-0.6)*10]; ctx.beginPath(); ctx.moveTo(x2,y2); ctx.lineTo(p1[0],p1[1]); ctx.lineTo(p2[0],p2[1]); ctx.closePath(); ctx.fillStyle=col; ctx.fill(); }
  // Węzły
  for(const [c, pos] of Object.entries(NODE_POS)){ const [x,y]=pos; ctx.fillStyle=(c!=='Start'&&c!=='Sink')? '#282A35' : '#22232C'; ctx.strokeStyle=COLOR.mid; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(x,y,NODE_R,0,Math.PI*2); ctx.fill(); ctx.stroke(); ctx.fillStyle=COLOR.ink; ctx.font='22px system-ui'; ctx.textAlign='center'; ctx.fillText(c, x, y-10); }
  // Paski postępu w gniazdach
  for(const [cell, cur] of Object.entries(sim.cell_current)){ if(!cur) continue; const [jid,idx,route,times,start,finish]=cur; const frac=Math.max(0,Math.min(1,(sim.time-start)/(finish-start))); const [x,y]=NODE_POS[cell]; const w=NODE_R*2, h=8, yb=y+NODE_R+PROGRESS_MARGIN_Y; ctx.strokeStyle=COLOR.mid; ctx.strokeRect(x-w/2, yb, w, h); ctx.fillStyle=COLOR.green; ctx.fillRect(x-w/2+1, yb+1, (w-2)*frac, h-2); ctx.fillStyle=COLOR.ink; ctx.fillText(`${jid} ${(frac*100).toFixed(0)}%`, x, yb+22); }
  // Kolejki
  if(SHOW_QUEUES){ queueHits.clear(); for(const [cell, rect] of Object.entries(slotRects(sim))){ drawQueue(sim, cell, rect); } }
  // Tokeny
  for(const [jid, tok] of tokens){ if(!tok.active) continue; const p=tok.position(sim.time); const color=(tok.lastPair[0]==='Start')? COLOR.start : colorForPair(tok.lastPair[0], tok.lastPair[1]); ctx.fillStyle=color; ctx.beginPath(); ctx.arc(p[0],p[1],9,0,Math.PI*2); ctx.fill(); if(selectedJob===jid){ ctx.strokeStyle='#fff'; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(p[0],p[1],12,0,Math.PI*2); ctx.stroke(); } ctx.fillStyle=COLOR.ink; ctx.font='16px system-ui'; ctx.textAlign='center'; ctx.fillText(jid, p[0], p[1]-20); }
  ctx.restore(); }

function slotSize(sim, cell){ const q=sim.cell_queues[cell]||[]; const cols=Math.max(QUEUE_COLLAPSED_SHOW, QUEUE_COLS_EXP); const w=Math.max(220, Math.min(360, SLOT_PADDING_X*2 + cols*(QUEUE_DOT_R*2+QUEUE_GAP))); const expanded=queueExpanded.has(cell); const h= expanded? (SLOT_PADDING_Y*2 + Math.ceil(q.length/QUEUE_COLS_EXP)*ROW_H) : QUEUE_BAR_H_BASE; return [w|0, h|0]; }
function slotRects(sim){ const rects={}; for(const cell of Object.keys(sim.cell_queues)){ const [w,h]=slotSize(sim,cell); const mode=slotMode[cell]||'REL'; let x,y; if(mode==='REL'){ const rel=slotAnchorRel[cell]||[-(w>>1), NODE_R+14]; const [cx,cy]=NODE_POS[cell]; x=(cx+rel[0])|0; y=(cy+rel[1])|0; } else { const abs=slotPosAbs[cell]||[NODE_POS[cell][0]-(w>>1), NODE_POS[cell][1]+NODE_R+14]; x=abs[0]|0; y=abs[1]|0; } x=Math.max(0, Math.min(WORLD_W-w, x)); y=Math.max(48, Math.min(WORLD_H-FOOTER_H-20, y)); rects[cell]=[x,y,w,h]; } return rects; }

function drawQueue(sim, cell, rect){ const q=sim.cell_queues[cell]||[]; const [bx,by,w,h]=rect; const hits=[]; queueHits.set(cell, hits); function addHit(x,y,jid){ hits.push({rect:[x-(QUEUE_DOT_R+4), y-(QUEUE_DOT_R+4), (QUEUE_DOT_R+4)*2, (QUEUE_DOT_R+4)*2], jid}); } function dot(x,y,color,{ring=false,selected=false}={}){ ctx.fillStyle=color; ctx.beginPath(); ctx.arc(x,y,QUEUE_DOT_R,0,Math.PI*2); ctx.fill(); if(selected){ ctx.strokeStyle='#fff'; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(x,y,QUEUE_DOT_R+4,0,Math.PI*2); ctx.stroke(); } else if(ring){ ctx.strokeStyle=COLOR.green; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(x,y,QUEUE_DOT_R+3,0,Math.PI*2); ctx.stroke(); } } ctx.fillStyle='#1E202C'; ctx.fillRect(bx,by,w,h); ctx.strokeStyle=COLOR.mid; ctx.strokeRect(bx,by,w,h); const [cx,cy]=NODE_POS[cell]; const tagY = (by>=cy)? (by-16) : (by+h+2); ctx.fillStyle=COLOR.ink; ctx.font='16px system-ui'; ctx.textAlign='left'; ctx.fillText(`${cell} [${slotMode[cell]||'REL'}]`, bx+6, tagY); if(queueExpanded.has(cell)){ const cols=QUEUE_COLS_EXP; let i=0; for(const [jid,idx,route,times,src] of q){ const row=Math.floor(i/cols), col=i%cols; const x=bx+SLOT_PADDING_X+col*(QUEUE_DOT_R*2+QUEUE_GAP)+QUEUE_DOT_R; const y=by+SLOT_PADDING_Y+row*ROW_H+QUEUE_DOT_R; i++; const prev=(idx>0)? route[idx-1] : src; const colc = (prev==='Start')? COLOR.start : colorForPair(prev, route[idx]); dot(x,y,colc,{ring:(i===1), selected:(jid===selectedJob)}); addHit(x,y,jid); } ctx.fillStyle=COLOR.ink; ctx.textAlign='left'; ctx.fillText(`Q=${q.length} (kliknij, by zwinąć)`, bx, by+h+14); } else { const show=Math.min(q.length, QUEUE_COLLAPSED_SHOW); let x=bx+w-SLOT_PADDING_X-QUEUE_DOT_R, y=by+(h>>1); for(let i=0;i<show;i++){ const [jid,idx,route,times,src]=q[i]; const prev=(idx>0)? route[idx-1] : src; const colc=(prev==='Start')? COLOR.start : colorForPair(prev, route[idx]); dot(x,y,colc,{ring:(i===0), selected:(jid===selectedJob)}); addHit(x,y,jid); x -= (QUEUE_DOT_R*2+QUEUE_GAP);} const rest=q.length-show; if(rest>0){ ctx.fillStyle=COLOR.ink; ctx.textAlign='left'; ctx.fillText(`+${rest}`, bx+SLOT_PADDING_X, by+(h>>1)+6); } if(q.length){ const [jid0,idx0,route0]=q[0]; const pr=(idx0>0)? route0[idx0-1] : 'Start'; const tagt=`${pr}→${route0[idx0]}`; const colc=(pr==='Start')? COLOR.start : colorForPair(pr,route0[idx0]); ctx.fillStyle=colc; ctx.textAlign='right'; ctx.fillText(tagt, bx+w-4, tagY); } ctx.fillStyle=COLOR.ink; ctx.textAlign='center'; ctx.fillText(`Q=${q.length}`, bx+(w>>1), by+h+14); } }

// ---------- Synchronizacja animacji z logiem ----------
function syncFromLog(sim, simTime){ for(const row of sim.log){ if(row.czas>simTime) break; const jid=row.zlecenie; const ev=row.zdarzenie; if(jid && !tokens.has(jid)) tokens.set(jid, new Token(jid, sim.jobs[jid]?.route||[])); if(ev==='RELEASE'){ const tok=tokens.get(jid); tok.setActive(true); tok.setInCell('Start',-1); } else if(ev==='RUSZA NA KRAWĘDŹ'){ const dest=row.gniazdo; const tok=tokens.get(jid); const a=(tok.state==='in_cell')? tok.cell : (tok.moveTo||'Start'); const st=row.czas, en=st+MOVE_TIME; tok.setMoving(a, dest, st, en, tok.idx+1); } else if(['PRZYBYŁ DO GNIAZDA','START'].includes(ev)){ const tok=tokens.get(jid); tok.setInCell(row.gniazdo, tok.idx>=0? tok.idx:0); if(ev==='PRZYBYŁ DO GNIAZDA'){ tok.lastPair=[(tok.idx>0? tok.route[tok.idx-1]:'Start'), tok.route[tok.idx]]; } } else if(ev==='PRZYBYŁ DO SINK'){ const tok=tokens.get(jid); tok.setInCell('Sink', tok.idx); } }
}

// ---------- Sterowanie ----------
let sim=new ConwipSim(N_JOBS); let simTime=0; let paused=true; let lastRAF=0;
function updateStateLine(){ const s=document.getElementById('stateLine'); s.textContent = `Czas=${simTime.toFixed(1)} min   WIP=${sim.WIP}   Backlog=${sim.backlog.length}   CONWIP=${sim.cards_avail}/${sim.cards_total}   x${SIM_SPEED.toFixed(2)}   MOVE_TIME=${MOVE_TIME.toFixed(2)}  `; }
function loop(ts){ if(!lastRAF) lastRAF=ts; const dt=(ts-lastRAF)/1000; lastRAF=ts; if(!paused){ simTime += dt*SIM_SPEED*60.0; sim.stepUntil(simTime); } syncFromLog(sim, simTime); drawWorld(sim); renderFooter(sim); updateStateLine(); requestAnimationFrame(loop); } requestAnimationFrame(loop);

// Toolbar elements
const btnPlay=document.getElementById('btnPlay'); const btnStep=document.getElementById('btnStep');
const rngSpeed=document.getElementById('speed'); const speedVal=document.getElementById('speedVal');
const rngMove=document.getElementById('moveTime'); const moveVal=document.getElementById('moveVal');
const rngConwip=document.getElementById('conwip'); const conwipVal=document.getElementById('conwipVal'); const btnApplyConwip=document.getElementById('btnApplyConwip');
const btnQueues=document.getElementById('btnQueues'); const btnFit=document.getElementById('btnFit');
const btnSaveLayout=document.getElementById('btnSaveLayout'); const btnLoadLayout=document.getElementById('btnLoadLayout');
const btnCsv=document.getElementById('btnCsv'); const btnJsonl=document.getElementById('btnJsonl');

btnPlay.onclick=()=>{ paused=!paused; btnPlay.textContent = paused? '▶︎ Start':'❚❚ Pauza'; };
btnStep.onclick=()=>{ simTime+=SIM_DT_STEP; sim.stepUntil(simTime); };
rngSpeed.oninput=()=>{ SIM_SPEED=+rngSpeed.value; speedVal.textContent=`x${SIM_SPEED.toFixed(2)}`; };
rngMove.oninput=()=>{ MOVE_TIME=+rngMove.value; moveVal.textContent=`${MOVE_TIME.toFixed(1)}m`; };
rngConwip.oninput=()=>{ conwipVal.textContent=`${rngConwip.value} kart`; };
btnApplyConwip.onclick=()=>{ const v=+rngConwip.value|0; CONWIP_LIMIT=v; // reinit sim (czyści bieg!)
  const t=simTime; sim=new ConwipSim(N_JOBS); sim.cards_total=v; sim.cards_avail=v; simTime=0; tokens.clear(); for(const jid of Object.keys(sim.jobs).sort()){ tokens.set(jid, new Token(jid, sim.jobs[jid].route)); } };
btnQueues.onclick=()=>{ SHOW_QUEUES=!SHOW_QUEUES; btnQueues.textContent = SHOW_QUEUES? 'Ukryj kolejki':'Pokaż kolejki'; btnQueues.setAttribute('aria-pressed', SHOW_QUEUES? 'true':'false'); };
btnFit.onclick=fitToWindow;
btnSaveLayout.onclick=()=>{ const data={nodes:NODE_POS, slotMode, slotAnchorRel, slotPosAbs}; localStorage.setItem('conwip_layout', JSON.stringify(data)); alert('Zapisano layout (localStorage).'); };
btnLoadLayout.onclick=()=>{ const raw=localStorage.getItem('conwip_layout'); if(!raw){ alert('Brak zapisanego layoutu'); return; } const d=JSON.parse(raw); if(d.nodes) NODE_POS=d.nodes; if(d.slotMode) slotMode=d.slotMode; if(d.slotAnchorRel) slotAnchorRel=d.slotAnchorRel; if(d.slotPosAbs) slotPosAbs=d.slotPosAbs; };

function download(filename, text){ const blob=new Blob([text], {type:'text/plain;charset=utf-8'}); const url=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download=filename; a.click(); URL.revokeObjectURL(url); }
btnCsv.onclick=()=>{ const cols=["czas","zdarzenie","zlecenie","operacja","gniazdo","szczegóły","WIP","conwip","marszruta"]; const lines=[cols.join(',')]; for(const r of sim.log){ lines.push(cols.map(k=>{ let v=r[k]; if(v==null) return ''; v=String(v).replaceAll('"','""'); if(v.includes(',')||v.includes('"')) return '"'+v+'"'; return v; }).join(',')); } download('conwip_logs.csv', lines.join('\n')); };
btnJsonl.onclick=()=>{ const text=sim.log.map(r=>JSON.stringify(r)).join('\n'); download('conwip_logs.jsonl', text); };

// Pan/zoom & interakcje
let panning=false, panStart=[0,0], offStart=[0,0];
function screenToWorld(sx,sy){ const stage=document.getElementById('stage'); const rect=stage.getBoundingClientRect(); const x=viewOff[0]+(sx-rect.left)/viewScale; const y=viewOff[1]+(sy-rect.top)/viewScale; return [x,y]; }
function clampView(){ const stage=document.getElementById('stage'); const cw=stage.clientWidth, ch=stage.clientHeight; const vw=Math.min(WORLD_W, cw/viewScale), vh=Math.min(WORLD_H, ch/viewScale); const maxx=Math.max(0, WORLD_W-vw), maxy=Math.max(0, WORLD_H-vh); viewOff[0]=Math.max(0, Math.min(maxx, viewOff[0])); viewOff[1]=Math.max(0, Math.min(maxy, viewOff[1])); }
window.addEventListener('resize', fitToWindow);

document.addEventListener('wheel', (e)=>{ const stage=document.getElementById('stage'); const rect=stage.getBoundingClientRect(); if(e.target!==stage && e.target!==canvas) return; e.preventDefault(); const mx=e.clientX, my=e.clientY; const [wx,wy]=screenToWorld(mx,my); const f = (e.deltaY<0)? 1.1 : 1/1.1; viewScale = Math.max(0.4, Math.min(2.0, viewScale*f)); viewOff[0]=wx - (mx-rect.left)/viewScale; viewOff[1]=wy - (my-rect.top)/viewScale; clampView(); }, {passive:false});

document.addEventListener('mousedown', (e)=>{ const stage=document.getElementById('stage'); if(!(e.target===stage || e.target===canvas)) return; const [wx,wy]=screenToWorld(e.clientX, e.clientY); if(e.button===2){ panning=true; panStart=[e.clientX,e.clientY]; offStart=[...viewOff]; return; } if(e.button!==0) return; for(const [cell,arr] of queueHits){ for(const it of arr){ const [x,y,w,h]=it.rect; if(wx>=x && wx<=x+w && wy>=y && wy<=y+h){ selectedJob=it.jid; renderJobPanel(sim, selectedJob); return; } } } let best=null, bestd2=1e9; for(const [jid,tok] of tokens){ if(!tok.active) continue; const [x,y]=tok.position(sim.time); const d2=(wx-x)*(wx-x)+(wy-y)*(wy-y); if(d2<12*12 && d2<bestd2){ bestd2=d2; best=jid; } } if(best){ selectedJob=best; renderJobPanel(sim, selectedJob); return; } const rects=slotRects(sim); for(const [cell, rc] of Object.entries(rects)){ const [x,y,w,h]=rc; if(wx>=x && wx<=x+w && wy>=y && wy<=y+h){ draggingSlot=cell; dragSlotOff=[wx-x, wy-y]; return; } } for(const [c,[x,y]] of Object.entries(NODE_POS)){ if((wx-x)*(wx-x)+(wy-y)*(wy-y) <= (NODE_R+6)*(NODE_R+6)){ draggingNode=c; dragOff=[wx-x, wy-y]; return; } } });

document.addEventListener('mousemove', (e)=>{ if(panning){ const dx=e.clientX-panStart[0], dy=e.clientY-panStart[1]; viewOff[0]=offStart[0]-dx/viewScale; viewOff[1]=offStart[1]-dy/viewScale; clampView(); return; } const [wx,wy]=screenToWorld(e.clientX, e.clientY); if(draggingNode){ let nx=Math.max(60, Math.min(WORLD_W-60, wx-dragOff[0])); let ny=Math.max(60, Math.min(WORLD_H-FOOTER_H-120, wy-dragOff[1])); NODE_POS[draggingNode]=[nx,ny]; return; } if(draggingSlot){ const [w,h]=slotSize(sim,draggingSlot); let x=Math.max(0, Math.min(WORLD_W-w, wx-dragSlotOff[0])); let y=Math.max(48, Math.min(WORLD_H-FOOTER_H-20, wy-dragSlotOff[1])); const mode=slotMode[draggingSlot]||'REL'; if(mode==='REL'){ const [cx,cy]=NODE_POS[draggingSlot]; slotAnchorRel[draggingSlot]=[Math.round(x-cx), Math.round(y-cy)]; } else { slotPosAbs[draggingSlot]=[Math.round(x), Math.round(y)]; } return; } });

document.addEventListener('mouseup', (e)=>{ if(e.button===2) panning=false; draggingNode=null; draggingSlot=null; });

document.addEventListener('contextmenu', (e)=>{ const stage=document.getElementById('stage'); if(e.target===stage || e.target===canvas) { e.preventDefault(); } });

document.addEventListener('keydown', (e)=>{ if(e.key===' '){ paused=!paused; btnPlay.textContent = paused? '▶︎ Start':'❚❚ Pauza'; } else if(e.key==='ArrowRight'){ simTime+=SIM_DT_STEP; sim.stepUntil(simTime); } else if(e.key==='Escape'){ selectedJob=null; renderJobPanel(sim, selectedJob); } else if(e.key==='f' || e.key==='F'){ fitToWindow(); } else if(e.key==='q' || e.key==='Q'){ SHOW_QUEUES=!SHOW_QUEUES; btnQueues.textContent = SHOW_QUEUES? 'Ukryj kolejki':'Pokaż kolejki'; btnQueues.setAttribute('aria-pressed', SHOW_QUEUES? 'true':'false'); } else if(e.key==='k' || e.key==='K'){ const [wx,wy]=screenToWorld(window._lastMouseX||0, window._lastMouseY||0); const rects=slotRects(sim); for(const [cell, rc] of Object.entries(rects)){ const [x,y,w,h]=rc; if(wx>=x && wx<=x+w && wy>=y && wy<=y+h){ const cur=slotMode[cell]||'REL'; if(cur==='REL'){ slotMode[cell]='ABS'; slotPosAbs[cell]=[x,y]; } else { slotMode[cell]='REL'; const [cx,cy]=NODE_POS[cell]; slotAnchorRel[cell]=[x-cx,y-cy]; } break; } } } });

document.addEventListener('mousemove', (e)=>{ window._lastMouseX=e.clientX; window._lastMouseY=e.clientY; });

// Inicjalizacja tokenów (nieaktywne na starcie)
for(const jid of Object.keys(sim.jobs).sort()){ tokens.set(jid, new Token(jid, sim.jobs[jid].route)); }
</script>
